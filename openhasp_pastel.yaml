esphome:
  name: esp32-display
  friendly_name: "4848s040"

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

# ============================================================
# ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
# ============================================================
globals:
  - id: uart_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: selected_mode
    type: std::string
    restore_value: no
    initial_value: '"СТАНДАРТНЫЙ"'
  - id: current_mode_from_arduino
    type: std::string
    restore_value: no
    initial_value: '"СТАНДАРТНЫЙ"'
  - id: press_timer
    type: int
    restore_value: no
    initial_value: '0'
  - id: active_mode_id
    type: int
    restore_value: no
    initial_value: '0'
  - id: mode_activated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: inactivity_timer
    type: int
    restore_value: no
    initial_value: '0'
  - id: screensaver_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wakeup_block
    type: int
    restore_value: no
    initial_value: '0'
  - id: normal_brightness
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: screensaver_brightness
    type: float
    restore_value: no
    initial_value: '0.25'
  - id: current_brightness
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: current_date
    type: std::string
    restore_value: no
    initial_value: '"Сб 20-июнь-2026"'
  - id: current_time
    type: std::string
    restore_value: no
    initial_value: '"14:32"'
  - id: temp_street
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: temp_outdoor
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: temp_from_home
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: temp_to_home
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: temp_recuperator
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: filter_supply
    type: int
    restore_value: no
    initial_value: '0'
  - id: filter_exhaust
    type: int
    restore_value: no
    initial_value: '0'
  - id: efficiency
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_uart_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: uart_link_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: data_stale
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: arduino_poll_started
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: boot_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ============================================================
# UART ДЛЯ СВЯЗИ С ARDUINO
# ============================================================
uart:
  id: uart_arduino
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE

# ============================================================
# ИНТЕРВАЛЫ
# ============================================================
interval:
  # 0) Запомнить момент загрузки
  - interval: 1s
    then:
      - lambda: |-
          if (id(boot_ms) == 0) {
            id(boot_ms) = millis();
            ESP_LOGI("boot", "Boot time recorded, Arduino polling will start in 30 s");
          }

  # 1) Запрос данных у Arduino каждые 5 с (только после 30 с)
  - interval: 5s
    then:
      - lambda: |-
          if (!id(arduino_poll_started)) {
            if (id(boot_ms) != 0 && (millis() - id(boot_ms) >= 30000)) {
              id(arduino_poll_started) = true;
              id(last_uart_rx_ms) = millis();
              ESP_LOGI("data", "Arduino polling enabled (30 s after boot)");
            } else {
              return;
            }
          }
          ESP_LOGI("data", "Requesting data from Arduino");
          id(uart_arduino).write_str("GET_DATA\n");

  # 2) Парсер UART
  - interval: 200ms
    then:
      - lambda: |-
          size_t avail = id(uart_arduino).available();
          if (avail > 0) {
            uint8_t tmp[128];
            size_t to_read = std::min(avail, sizeof(tmp));
            if (id(uart_arduino).read_array(tmp, to_read)) {
              for (size_t i = 0; i < to_read; i++) {
                id(uart_buffer) += static_cast<char>(tmp[i]);
              }
            }
          }

          if (id(uart_buffer).size() > 512) {
            id(uart_buffer).erase(0, id(uart_buffer).size() - 256);
          }

          if (!id(arduino_poll_started)) {
            return;
          }

          bool got_valid = false;
          size_t newline_pos;
          while ((newline_pos = id(uart_buffer).find('\n')) != std::string::npos) {
            std::string line = id(uart_buffer).substr(0, newline_pos);
            id(uart_buffer) = id(uart_buffer).substr(newline_pos + 1);

            line.erase(std::remove(line.begin(), line.end(), '\r'), line.end());
            size_t start = line.find_first_not_of(" \t");
            size_t end   = line.find_last_not_of(" \t");
            if (start == std::string::npos) continue;
            line = line.substr(start, end - start + 1);
            if (line.empty()) continue;

            ESP_LOGI("main", "Received: %s", line.c_str());
            got_valid = true;

            if (line == "END") {
              continue;
            }

            // TEMP:<OUT|IN|SUPPLY|EXHAUST|RECUP>:<value>
            if (line.rfind("TEMP:", 0) == 0) {
              size_t c1 = line.find(':', 5);
              if (c1 != std::string::npos) {
                std::string sensor = line.substr(5, c1 - 5);
                float val = atof(line.substr(c1 + 1).c_str());
                char buf[16];
                snprintf(buf, sizeof(buf), "%+.1f", val);

                if (sensor == "OUT") {
                id(temp_street) = val;
                lv_label_set_text(id(gradussulicy), buf);
                } else if (sensor == "TO_OUT") {
                id(temp_outdoor) = val;
                lv_label_set_text(id(widget_1781262306198_b9dnjbboi), buf);
                } else if (sensor == "FROM_RECUP") {
                id(temp_recuperator) = val;
                lv_label_set_text(id(temp_recup_value), buf);
                } else if (sensor == "FROM_HOUSE") {
                id(temp_from_home) = val;
                lv_label_set_text(id(widget_1781262307812_3m3qdg397), buf);
                } else if (sensor == "TO_HOUSE") {
                id(temp_to_home) = val;
                lv_label_set_text(id(widget_1781262308709_dnoiw7el6), buf);
                }
              }
              continue;
            }

            // FILTER:<SUPPLY|EXHAUST>:<0-100>
            if (line.rfind("FILTER:", 0) == 0) {
              size_t c1 = line.find(':', 7);
              if (c1 != std::string::npos) {
                std::string ch = line.substr(7, c1 - 7);
                int pct = atoi(line.substr(c1 + 1).c_str());
                if (pct < 0)   pct = 0;
                if (pct > 100) pct = 100;

                lv_color_t color;
                if (pct <= 50) {
                  color = lv_color_hex(0x12D90D);
                } else if (pct <= 70) {
                  color = lv_color_hex(0xF59E0B);
                } else {
                  color = lv_color_hex(0xDC2626);
                }

                char buf[8];
                snprintf(buf, sizeof(buf), "%d%%", pct);

                if (ch == "SUPPLY") {
                  id(filter_supply) = pct;
                  lv_arc_set_value(id(widget_1781261697547_smtgd7w9q), pct);
                  lv_obj_set_style_arc_color(id(widget_1781261697547_smtgd7w9q), color, LV_PART_INDICATOR);
                  lv_label_set_text(id(lv_label_0), buf);
                  lv_obj_set_style_text_color(id(lv_label_0), color, 0);
                } else if (ch == "EXHAUST") {
                  id(filter_exhaust) = pct;
                  lv_arc_set_value(id(widget_1781261697547_jcbrfzs59), pct);
                  lv_obj_set_style_arc_color(id(widget_1781261697547_jcbrfzs59), color, LV_PART_INDICATOR);
                  lv_label_set_text(id(widget_1781261697547_036jpjyoc), buf);
                  lv_obj_set_style_text_color(id(widget_1781261697547_036jpjyoc), color, 0);
                }
              }
              continue;
            }

            // EFFICIENCY:<0-100> / EFF:<0-100>
            if (line.rfind("EFFICIENCY:", 0) == 0 || line.rfind("EFF:", 0) == 0) {
              size_t pos = line.find(':');
              if (pos != std::string::npos) {
                int pct = atoi(line.substr(pos + 1).c_str());
                if (pct < 0)   pct = 0;
                if (pct > 100) pct = 100;
                id(efficiency) = pct;

                lv_color_t color;
                if (pct <= 50) {
                  color = lv_color_hex(0x12D90D);
                } else if (pct <= 70) {
                  color = lv_color_hex(0xF59E0B);
                } else {
                  color = lv_color_hex(0xDC2626);
                }

                char buf[8];
                snprintf(buf, sizeof(buf), "%d%%", pct);
                lv_arc_set_value(id(efficiency_arc), pct);
                lv_obj_set_style_arc_color(id(efficiency_arc), color, LV_PART_INDICATOR);
                lv_label_set_text(id(efficiency_label), buf);
                lv_obj_set_style_text_color(id(efficiency_label), color, 0);
              }
              continue;
            }

            // MODE:<название>
            if (line.rfind("MODE:", 0) == 0) {
              std::string mode = line.substr(5);
              size_t s = mode.find_first_not_of(" \t");
              size_t e = mode.find_last_not_of(" \t");
              if (s != std::string::npos) mode = mode.substr(s, e - s + 1);

              id(current_mode_from_arduino) = mode;
              id(selected_mode) = mode;
              lv_label_set_text(id(mode_display), mode.c_str());

              if (mode == "СТОП") {
                lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0xFF0000), 0);
              } else {
                lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
              }
              continue;
            }

            // DATE <дата> <время>
            std::string payload = line;
            if (payload.rfind("DATE ", 0) == 0) {
              payload = payload.substr(5);
            }

            size_t space_pos = payload.find(' ');
            if (space_pos != std::string::npos) {
              std::string date_part = payload.substr(0, space_pos);
              std::string time_part = payload.substr(space_pos + 1);

              id(current_date) = date_part;
              id(current_time) = time_part;

              lv_label_set_text(id(Date),                date_part.c_str());
              lv_label_set_text(id(time_label),          time_part.c_str());
              lv_label_set_text(id(Date_modes),          date_part.c_str());
              lv_label_set_text(id(time_label_modes),    time_part.c_str());
              lv_label_set_text(id(Date_settings),       date_part.c_str());
              lv_label_set_text(id(time_label_settings), time_part.c_str());
              lv_label_set_text(id(screensaver_date),    date_part.c_str());
              lv_label_set_text(id(screensaver_time),    time_part.c_str());
            }
          }

          if (got_valid) {
            id(last_uart_rx_ms) = millis();
            id(uart_link_ok) = true;
            if (id(data_stale)) {
              ESP_LOGI("uart", "Link restored");
              id(data_stale) = false;
            }
          }

  # 3) WATCHDOG: нет данных > 60 с -> N/A
  - interval: 5s
    then:
      - lambda: |-
          if (!id(arduino_poll_started)) return;
          if (!id(uart_link_ok)) return;
          uint32_t now = millis();
          if (id(last_uart_rx_ms) == 0) return;
          uint32_t age = now - id(last_uart_rx_ms);
          if (age > 60000 && !id(data_stale)) {
            ESP_LOGW("uart", "No data from Arduino for %lu ms -> showing N/A", (unsigned long) age);
            id(data_stale) = true;
            lv_label_set_text(id(gradussulicy), "N/A");
            lv_label_set_text(id(widget_1781262306198_b9dnjbboi), "N/A");
            lv_label_set_text(id(widget_1781262307812_3m3qdg397), "N/A");
            lv_label_set_text(id(widget_1781262308709_dnoiw7el6), "N/A");
            lv_label_set_text(id(temp_recup_value), "N/A");
            lv_label_set_text(id(lv_label_0), "N/A");
            lv_label_set_text(id(widget_1781261697547_036jpjyoc), "N/A");
            lv_label_set_text(id(efficiency_label), "N/A");
            lv_obj_set_style_text_color(id(lv_label_0), lv_color_hex(0x9CA3AF), 0);
            lv_obj_set_style_text_color(id(widget_1781261697547_036jpjyoc), lv_color_hex(0x9CA3AF), 0);
            lv_obj_set_style_text_color(id(efficiency_label), lv_color_hex(0x9CA3AF), 0);
            lv_arc_set_value(id(widget_1781261697547_smtgd7w9q), 0);
            lv_arc_set_value(id(widget_1781261697547_jcbrfzs59), 0);
            lv_arc_set_value(id(efficiency_arc), 0);
            lv_obj_set_style_arc_color(id(widget_1781261697547_smtgd7w9q), lv_color_hex(0x6B7280), LV_PART_INDICATOR);
            lv_obj_set_style_arc_color(id(widget_1781261697547_jcbrfzs59), lv_color_hex(0x6B7280), LV_PART_INDICATOR);
            lv_obj_set_style_arc_color(id(efficiency_arc), lv_color_hex(0x6B7280), LV_PART_INDICATOR);
            lv_label_set_text(id(Date),                "N/A");
            lv_label_set_text(id(time_label),          "N/A");
            lv_label_set_text(id(Date_modes),          "N/A");
            lv_label_set_text(id(time_label_modes),    "N/A");
            lv_label_set_text(id(Date_settings),       "N/A");
            lv_label_set_text(id(time_label_settings), "N/A");
            lv_label_set_text(id(screensaver_date),    "N/A");
            lv_label_set_text(id(screensaver_time),    "N/A");
          }

  # 4) Скринсейвер
  - interval: 1s
    then:
      - lambda: |-
          if (id(wakeup_block) > 0) {
            id(wakeup_block)--;
          }
          if (!id(screensaver_active) && id(wakeup_block) == 0) {
            id(inactivity_timer)++;
            if (id(inactivity_timer) >= 30) {
              ESP_LOGI("screensaver", "Activating screensaver!");
              id(screensaver_active) = true;
              id(inactivity_timer) = 0;
              lv_obj_t *scr = lv_obj_get_parent(id(screensaver_image));
              if (scr != nullptr) {
                lv_scr_load(scr);
                lv_refr_now(nullptr);
              }
            }
          }

  # 5) Кнопки режимов: удержание 3 с
  - interval: 100ms
    then:
      - lambda: |-
          if (id(press_timer) > 0) {
            id(press_timer) += 100;
            if (id(press_timer) >= 3000 && !id(mode_activated)) {
              id(press_timer) = 0;
              id(mode_activated) = true;
              lv_obj_t *main_page = lv_obj_get_parent(id(mode_display));
              if (main_page == nullptr) {
                main_page = lv_scr_act();
              }
              switch(id(active_mode_id)) {
                case 1:
                  id(selected_mode) = "СТАНДАРТНЫЙ";
                  lv_label_set_text(id(mode_display), "СТАНДАРТНЫЙ");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:STANDARD\n");
                  break;
                case 2:
                  id(selected_mode) = "ЭКОНОМИЧНЫЙ";
                  lv_label_set_text(id(mode_display), "ЭКОНОМИЧНЫЙ");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:ECONOM\n");
                  break;
                case 3:
                  id(selected_mode) = "ГОСТЕВОЙ";
                  lv_label_set_text(id(mode_display), "ГОСТЕВОЙ");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:GUEST\n");
                  break;
                case 4:
                  id(selected_mode) = "КОНДИЦИОНЕР";
                  lv_label_set_text(id(mode_display), "КОНДИЦИОНЕР");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:CONDITIONER\n");
                  break;
                case 5:
                  id(selected_mode) = "ВЫСОКИЙ КПД";
                  lv_label_set_text(id(mode_display), "ВЫСОКИЙ КПД");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:HIGH_EFFICIENCY\n");
                  break;
                case 6:
                  id(selected_mode) = "СТОП";
                  lv_label_set_text(id(mode_display), "СТОП");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0xFF0000), 0);
                  id(uart_arduino).write_str("MODE:STOP\n");
                  break;
              }
              if (main_page != nullptr) {
                lv_scr_load(main_page);
                lv_refr_now(nullptr);
              }
              id(active_mode_id) = 0;
              id(mode_activated) = false;
            }
          }

  # 6) Плавное затухание/пробуждение подсветки
  - interval: 50ms
    then:
      - lambda: |-
          if (id(screensaver_active)) {
            float target = id(screensaver_brightness);
            float step = 0.01;
            if (id(current_brightness) > target) {
              id(current_brightness) -= step;
              if (id(current_brightness) < target) id(current_brightness) = target;
              auto call = id(display_backlight).make_call();
              call.set_brightness(id(current_brightness));
              call.perform();
            }
          } else {
            float target = id(normal_brightness);
            float step = 0.03;
            if (id(current_brightness) < target) {
              id(current_brightness) += step;
              if (id(current_brightness) > target) id(current_brightness) = target;
              auto call = id(display_backlight).make_call();
              call.set_brightness(id(current_brightness));
              call.perform();
            }
          }

# ============================================================
# ИЗОБРАЖЕНИЯ
# ============================================================
image:
  - file: "img/olako.png"
    id: background_image
    type: RGB565
    resize: 480x480
  - file: "img/family-home.png"
    id: icon_home
    type: RGB565
    resize: 32x32
    transparency: alpha_channel
  - file: "img/mode-fan.png"
    id: icon_modes
    type: RGB565
    resize: 32x32
    transparency: alpha_channel
  - file: "img/settings-heart.png"
    id: icon_settings
    type: RGB565
    resize: 32x32
    transparency: alpha_channel

# ============================================================
# ШРИФТЫ
# ============================================================
font:
  - file: "fonts/Roboto-Regular.ttf"
    id: cyrillic_font_40
    size: 40
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~АаБбВвГгДдЕеЁёЖжЗзИиЙйКкЛлМмНнОоПпРрСсТтУуФфХхЦцЧчШшЩщЪъЫыЬьЭэЮюЯя°'
  - file: "fonts/Roboto-Regular.ttf"
    id: cyrillic_font_24
    size: 24
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~АаБбВвГгДдЕеЁёЖжЗзИиЙйКкЛлМмНнОоПпРрСсТтУуФфХхЦцЧчШшЩщЪъЫыЬьЭэЮюЯя°'
  - file: "fonts/Roboto-Regular.ttf"
    id: cyrillic_font_12
    size: 12
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~АаБбВвГгДдЕеЁёЖжЗзИиЙйКкЛлМмНнОоПпРрСсТтУуФфХхЦцЧчШшЩщЪъЫыЬьЭэЮюЯя°'

# ============================================================
# РЕЛЕ
# ============================================================
switch:
  - platform: gpio
    name: "Реле 1"
    pin:
      number: GPIO40
      inverted: true
  - platform: gpio
    name: "Реле 2"
    pin:
      number: GPIO2
      inverted: true
  - platform: gpio
    name: "Реле 3"
    pin:
      number: GPIO1
      inverted: true

# ============================================================
# ПОДСВЕТКА
# ============================================================
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Подсветка"
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# ============================================================
# SPI ДЛЯ ДИСПЛЕЯ
# ============================================================
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

# ============================================================
# I2C ДЛЯ ТАЧСКРИНА (GT911)
# ============================================================
i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl: GPIO45

# ============================================================
# ДИСПЛЕЙ
# ============================================================
display:
  - platform: mipi_rgb
    id: tft_display
    model: GUITION-4848S040
    spi_id: lcd_spi
    cs_pin: GPIO39
    invert_colors: False

# ============================================================
# СЕНСОР ЭКРАНА (GT911)
# ============================================================
touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: tft_display
    i2c_id: touchscreen_bus
    address: 0x5D
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            ESP_LOGI("touch", "Touched at x=%d, y=%d", touch.x, touch.y);
        - if:
            condition:
              lambda: 'return id(screensaver_active);'
            then:
              - lambda: |-
                  id(screensaver_active) = false;
                  id(inactivity_timer) = 0;
                  id(wakeup_block) = 5;
                  lv_obj_t *main_page = lv_obj_get_parent(id(mode_display));
                  if (main_page != nullptr) {
                    lv_scr_load(main_page);
                    lv_refr_now(nullptr);
                  }
            else:
              - lambda: |-
                  id(inactivity_timer) = 0;
    on_release:
      then:
        - lambda: |-
            ESP_LOGI("touch", "Released");

