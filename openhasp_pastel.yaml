esphome:
  name: esp32-display-test
  friendly_name: "ESP32 Display Test"

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

# ============================================================
# UART
# ============================================================
uart:
  id: uart_arduino
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 115200

# ============================================================
# ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
# ============================================================
globals:
  - id: uart_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: cnt_a
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_b
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_c
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_d
    type: int
    restore_value: no
    initial_value: '0'
  - id: val_a
    type: float
    restore_value: no
    initial_value: '-999.0'
  - id: val_b
    type: float
    restore_value: no
    initial_value: '-999.0'
  - id: val_c
    type: float
    restore_value: no
    initial_value: '-999.0'
  - id: val_d
    type: float
    restore_value: no
    initial_value: '-999.0'

# ============================================================
# ИНТЕРВАЛЫ
# ============================================================
interval:
  # Запрос данных
  - interval: 5s
    then:
      - lambda: |-
          id(uart_arduino).write_str("GET_DATA\n");

  # ============================================================
  # ПАРСЕР: читаем UART и обновляем 4 метки РАЗНЫМИ способами
  # ============================================================
  - interval: 200ms
    then:
      - lambda: |-
          // === ЧТЕНИЕ UART ===
          uint8_t byte;
          int count = 0;
          while (id(uart_arduino).available() > 0 && count < 128) {
            if (id(uart_arduino).read_byte(&byte)) {
              id(uart_buffer) += static_cast<char>(byte);
              count++;
            } else break;
          }

          if (id(uart_buffer).size() > 512) {
            id(uart_buffer).erase(0, id(uart_buffer).size() - 256);
          }

          // === ПАРСИНГ ===
          size_t nl;
          while ((nl = id(uart_buffer).find('\n')) != std::string::npos) {
            std::string line = id(uart_buffer).substr(0, nl);
            id(uart_buffer) = id(uart_buffer).substr(nl + 1);
            line.erase(std::remove(line.begin(), line.end(), '\r'), line.end());
            if (line.empty()) continue;

            // ============================================================
            // ВАРИАНТ A: lv_label_set_text + lv_refr_now (прямая перерисовка)
            // "С улицы" — TEMP:OUT
            // ============================================================
            if (line.rfind("TEMP:OUT:", 0) == 0) {
              float v = atof(line.substr(9).c_str());
              id(val_a) = v;
              id(cnt_a) = id(cnt_a) + 1;
              char b[24];
              snprintf(b, sizeof(b), "%+.1f", v);
              lv_label_set_text(id(gradussulicy), b);
              lv_refr_now(nullptr);  // Принудительная перерисовка
              ESP_LOGI("disp_a", "A: OUT -> %s, count=%d", b, id(cnt_a));
            }

            // ============================================================
            // ВАРИАНТ B: через встроенное действие lvgl.label.update
            // "На улицу" — TEMP:IN
            // Обновление через action, не через прямой вызов LVGL API
            // ============================================================
            if (line.rfind("TEMP:IN:", 0) == 0) {
              float v = atof(line.substr(8).c_str());
              id(val_b) = v;
              id(cnt_b) = id(cnt_b) + 1;
              char b[24];
              snprintf(b, sizeof(b), "%+.1f", v);
              // Используем action ESPHome (не прямой C-вызов)
              id(label_update_action).set_text(b);
              id(label_update_action).perform();
              ESP_LOGI("disp_b", "B: IN -> %s, count=%d", b, id(cnt_b));
            }

            // ============================================================
            // ВАРИАНТ C: только set_text, перерисовка отдельным интервалом
            // "Из дома" — TEMP:SUPPLY
            // ============================================================
            if (line.rfind("TEMP:SUPPLY:", 0) == 0) {
              float v = atof(line.substr(12).c_str());
              id(val_c) = v;
              id(cnt_c) = id(cnt_c) + 1;
              char b[24];
              snprintf(b, sizeof(b), "%+.1f", v);
              lv_label_set_text(id(widget_1781262307812_3m3qdg397), b);
              // НЕ вызываем lv_refr_now здесь — перерисовка в отдельном interval
              ESP_LOGI("disp_c", "C: SUPPLY -> %s, count=%d", b, id(cnt_c));
            }

            // ============================================================
            // ВАРИАНТ D: display.update после обновления метки
            // "В дом" — TEMP:EXHAUST
            // ============================================================
            if (line.rfind("TEMP:EXHAUST:", 0) == 0) {
              float v = atof(line.substr(13).c_str());
              id(val_d) = v;
              id(cnt_d) = id(cnt_d) + 1;
              char b[24];
              snprintf(b, sizeof(b), "%+.1f", v);
              lv_label_set_text(id(widget_1781262308709_dnoiw7el6), b);
              // Принудительное обновление через компонент дисплея
              id(tft_display).update();
              ESP_LOGI("disp_d", "D: EXHAUST -> %s, count=%d", b, id(cnt_d));
            }
          }

          // ============================================================
          // ОБНОВЛЕНИЕ СЧЁТЧИКОВ НА ЭКРАНЕ
          // ============================================================
          {
            char b[40];
            snprintf(b, sizeof(b), "A: %d", id(cnt_a));
            lv_label_set_text(id(label_cnt_a), b);
            snprintf(b, sizeof(b), "B: %d", id(cnt_b));
            lv_label_set_text(id(label_cnt_b), b);
            snprintf(b, sizeof(b), "C: %d", id(cnt_c));
            lv_label_set_text(id(label_cnt_c), b);
            snprintf(b, sizeof(b), "D: %d", id(cnt_d));
            lv_label_set_text(id(label_cnt_d), b);
          }

  # ============================================================
  # ВАРИАНТ C: перерисовка отдельным интервалом (для проверки гипотезы)
  # ============================================================
  - interval: 300ms
    then:
      - lambda: |-
          // Только для варианта C: принудительная перерисовка
          // Если A работает, а C нет — значит проблема в тайминге
          lv_refr_now(nullptr);
