esphome:
  name: esp32-uart-test
  friendly_name: "UART Test"

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: VERBOSE
  # Логгер на UART0 (GPIO43/44) — смотрим логи через USB

# UART для Arduino — ВЫБЕРИТЕ СВОБОДНЫЕ ПИНЫ
# Начните с GPIO5/GPIO6 (проверьте, что они свободны на вашей плате)
uart:
  id: uart_arduino
  tx_pin: GPIO5
  rx_pin: GPIO6
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE

globals:
  - id: uart_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: request_timer
    type: int
    restore_value: no
    initial_value: '9'
  - id: rx_total
    type: int
    restore_value: no
    initial_value: '0'
  - id: tx_total
    type: int
    restore_value: no
    initial_value: '0'

interval:
  # Раз в секунду: раз в 10 с отправляем GET_DATA, раз в 5 с печатаем статистику
  - interval: 1s
    then:
      - lambda: |-
          id(request_timer)++;
          if (id(request_timer) >= 10) {
            id(request_timer) = 0;
            id(uart_arduino).write_str("GET_DATA\n");
            id(tx_total)++;
            ESP_LOGI("test", "TX #%d: GET_DATA", id(tx_total));
          }

  # Каждые 200 мс читаем всё, что пришло, и печатаем порциями
  - interval: 200ms
    then:
      - lambda: |-
          int n = 0;
          while (id(uart_arduino).available()) {
            uint8_t byte;
            if (id(uart_arduino).read_byte(&byte)) {
              id(uart_buffer) += static_cast<char>(byte);
              id(rx_total)++;
              n++;
            }
          }
          if (n > 0) {
            ESP_LOGI("test", "RX %d bytes (total %d)", n, id(rx_total));
          }

  # Каждые 5 секунд: печатаем накопленный буфер и статистику
  - interval: 5s
    then:
      - lambda: |-
          ESP_LOGI("test", "===== STATS: TX=%d, RX=%d bytes, buffer=%d =====",
                   id(tx_total), id(rx_total), id(uart_buffer).length());
          if (id(uart_buffer).length() > 0) {
            // Печатаем построчно, чтобы \n не ломал лог
            size_t start = 0;
            while (start < id(uart_buffer).length()) {
              size_t nl = id(uart_buffer).find('\n', start);
              if (nl == std::string::npos) {
                ESP_LOGI("test", "  PARTIAL: [%s]", id(uart_buffer).substr(start).c_str());
                break;
              }
              std::string line = id(uart_buffer).substr(start, nl - start);
              ESP_LOGI("test", "  LINE: [%s]", line.c_str());
              start = nl + 1;
            }
            id(uart_buffer) = "";
          } else {
            ESP_LOGW("test", "  BUFFER EMPTY — данные от Arduino не приходят");
          }
