// Простая версия Arduino кода без RTC (использует millis())

String incomingCommand = "";

// Переменные для имитации времени
unsigned long lastSecond = 0;
int seconds = 0;
int minutes = 0;
int hours = 12;  // Начальное время 12:00
int days = 20;
int months = 6;
int years = 2026;

void setup() {
  Serial.begin(115200);
  Serial.println("Arduino готов к работе (имитация времени)");
}

void loop() {
  // Обновляем время каждую секунду
  if (millis() - lastSecond >= 1000) {
    lastSecond = millis();
    seconds++;
    
    if (seconds >= 60) {
      seconds = 0;
      minutes++;
      
      if (minutes >= 60) {
        minutes = 0;
        hours++;
        
        if (hours >= 24) {
          hours = 0;
          days++;
          
          // Простая имитация месяцев
          if (days > 30) {
            days = 1;
            months++;
            
            if (months > 12) {
              months = 1;
              years++;
            }
          }
        }
      }
    }
  }
  
  // Обработка команд от ESP32
  while (Serial.available() > 0) {
    char incomingChar = Serial.read();
    
    if (incomingChar == '\n') {
      processCommand(incomingCommand);
      incomingCommand = "";
    } else if (incomingChar != '\r') {
      incomingCommand += incomingChar;
    }
  }
}

void processCommand(String command) {
  command.trim();
  
  if (command == "GET_TIME") {
    sendTimeToESP32();
  }
  else if (command.startsWith("MODE:")) {
    String mode = command.substring(5);
    mode.trim();
    Serial.print("Получен режим: ");
    Serial.println(mode);
    // Здесь можно добавить обработку режимов
    Serial.println("OK:MODE_ACCEPTED");
  }
}

void sendTimeToESP32() {
  // Форматируем время
  String timeStr = String(hours) + ":" + String(minutes);
  if (hours < 10) timeStr = "0" + timeStr;
  if (minutes < 10) {
    int pos = timeStr.indexOf(':');
    timeStr = timeStr.substring(0, pos + 1) + "0" + timeStr.substring(pos + 1);
  }
  
  // Форматируем дату
  String monthNames[] = {"янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"};
  String dayNames[] = {"Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"};
  
  // Простой расчет дня недели (для демонстрации)
  int dayOfWeek = (days + 2) % 7; // Приблизительный расчет
  
  String dateStr = dayNames[dayOfWeek] + " " + String(days) + "-" + monthNames[months-1] + "-" + String(years);
  
  // Отправляем время на ESP32 в формате: TIME:ДД ММ ГГГГ ЧЧ:ММ
  Serial.print("TIME:");
  Serial.print(dateStr);
  Serial.print(" ");
  Serial.println(timeStr);
}
