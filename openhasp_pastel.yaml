esphome:
  name: esp32-display
  friendly_name: "4848s040"
  on_boot:
    then:
      - uart.write:
          id: uart_arduino
          data: "GET_MODE\n"
      - uart.write:
          id: uart_arduino
          data: "GET_DATA\n"
      - uart.write:
          id: uart_arduino
          data: "GET_STATUS\n"
      - lvgl.page.show: main_page
      - delay: 100ms
      - lambda: |-
          id(current_brightness) = id(normal_brightness);
          auto call = id(display_backlight).make_call();
          call.set_brightness(id(current_brightness));
          call.perform();

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
    version: latest
  board: esp32-s3-devkitc-1

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  manual_ip:
    static_ip: 192.168.0.100
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 4.4.4.4

logger:
  level: DEBUG
  baud_rate: 115200

# Глобальные переменные
globals:
  - id: uart_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: selected_mode
    type: std::string
    restore_value: no
    initial_value: '"СТАНДАРТНЫЙ"'
  - id: current_mode_from_arduino
    type: std::string
    restore_value: no
    initial_value: '"СТАНДАРТНЫЙ"'
  - id: press_timer
    type: int
    restore_value: no
    initial_value: '0'
  - id: active_mode_id
    type: int
    restore_value: no
    initial_value: '0'
  - id: mode_activated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: inactivity_timer
    type: int
    restore_value: no
    initial_value: '0'
  - id: screensaver_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wakeup_block
    type: int
    restore_value: no
    initial_value: '5'
  - id: normal_brightness
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: screensaver_brightness
    type: float
    restore_value: no
    initial_value: '0.25'
  - id: current_brightness
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: last_time_update
    type: int
    restore_value: no
    initial_value: '0'
  - id: current_date
    type: std::string
    restore_value: no
    initial_value: '"Сб 20-июнь-2026"'
  - id: current_time
    type: std::string
    restore_value: no
    initial_value: '"14:32"'
  - id: temp_street
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: temp_outdoor
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: temp_from_home
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: temp_to_home
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: filter_supply
    type: int
    restore_value: no
    initial_value: '0'
  - id: filter_exhaust
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_data_request
    type: int
    restore_value: no
    initial_value: '0'
  - id: data_request_failures
    type: int
    restore_value: no
    initial_value: '0'
  - id: arduino_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: data_request_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_received_data
    type: int
    restore_value: no
    initial_value: '0'
  - id: room_temp
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: supply_fan_speed
    type: int
    restore_value: no
    initial_value: '0'
  - id: exhaust_fan_speed
    type: int
    restore_value: no
    initial_value: '0'
  - id: efficiency
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: system_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: heating_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cooling_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pid_output
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: current_error
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: has_error
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_screensaver_switch
    type: bool
    restore_value: no
    initial_value: 'false'

# UART для связи с Arduino
uart:
  id: uart_arduino
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_buffer_size: 2048

# Интервалы
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(wakeup_block) > 0) {
            id(wakeup_block)--;
          }
          
          if (!id(screensaver_active) && id(wakeup_block) == 0) {
            id(inactivity_timer)++;
            
            if (id(inactivity_timer) >= 30) {
              id(screensaver_active) = true;
              id(inactivity_timer) = 0;
              id(last_screensaver_switch) = true;
            }
          }
          
          int current_time = millis() / 1000;
          if (id(last_received_data) > 0 && (current_time - id(last_received_data) > 15)) {
            if (id(arduino_connected)) {
              id(arduino_connected) = false;
            }
          }
          
          static int heartbeat_counter = 0;
          heartbeat_counter++;
          if (heartbeat_counter >= 10) {
            heartbeat_counter = 0;
            id(uart_arduino).write_str("PING\n");
          }

  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(last_screensaver_switch);'
          then:
            - lvgl.page.show: screensaver_page
            - lambda: |-
                id(last_screensaver_switch) = false;

  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(screensaver_active) && !id(last_screensaver_switch);'
          then:
            - lvgl.page.show: screensaver_page
      - if:
          condition:
            lambda: 'return !id(screensaver_active) && id(last_screensaver_switch);'
          then:
            - lvgl.page.show: main_page
            - lambda: |-
                id(last_screensaver_switch) = false;

  - interval: 100ms
    then:
      - lambda: |-
          if (id(press_timer) > 0) {
            id(press_timer) += 100;
            
            if (id(press_timer) >= 3000 && !id(mode_activated)) {
              id(press_timer) = 0;
              id(mode_activated) = true;
              
              switch(id(active_mode_id)) {
                case 1:
                  id(selected_mode) = "СТАНДАРТНЫЙ";
                  id(uart_arduino).write_str("MODE:СТАНДАРТНЫЙ\n");
                  break;
                case 2:
                  id(selected_mode) = "ЭКОНОМИЧНЫЙ";
                  id(uart_arduino).write_str("MODE:ЭКОНОМИЧНЫЙ\n");
                  break;
                case 3:
                  id(selected_mode) = "ГОСТЕВОЙ";
                  id(uart_arduino).write_str("MODE:ГОСТЕВОЙ\n");
                  break;
                case 4:
                  id(selected_mode) = "КОНДИЦИОНЕР";
                  id(uart_arduino).write_str("MODE:КОНДИЦИОНЕР\n");
                  break;
                case 5:
                  id(selected_mode) = "ВЫСОКИЙ КПД";
                  id(uart_arduino).write_str("MODE:ВЫСОКИЙ КПД\n");
                  break;
                case 6:
                  id(selected_mode) = "СТОП";
                  id(uart_arduino).write_str("MODE:СТОП\n");
                  break;
              }
              
              id(active_mode_id) = 0;
              id(mode_activated) = false;
            }
          }

  - interval: 3s
    then:
      - uart.write:
          id: uart_arduino
          data: "GET_DATA\n"

  - interval: 5s
    then:
      - uart.write:
          id: uart_arduino
          data: "GET_MODE\n"

  - interval: 10s
    then:
      - uart.write:
          id: uart_arduino
          data: "GET_STATUS\n"

  # ========== ГЛАВНЫЙ ОБРАБОТЧИК UART ==========
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(uart_arduino).available()) {
            return;
          }
          
          while (id(uart_arduino).available()) {
            uint8_t byte;
            if (id(uart_arduino).read_byte(&byte)) {
              if (byte == 0) continue;
              id(uart_buffer) += static_cast<char>(byte);
            }
          }
          
          size_t newline_pos = id(uart_buffer).find('\n');
          while (newline_pos != std::string::npos) {
            std::string line = id(uart_buffer).substr(0, newline_pos);
            id(uart_buffer) = id(uart_buffer).substr(newline_pos + 1);
            
            if (!line.empty() && line.back() == '\r') {
              line.pop_back();
            }
            
            if (line.empty()) {
              newline_pos = id(uart_buffer).find('\n');
              continue;
            }
            
            id(last_received_data) = millis() / 1000;
            id(data_request_pending) = false;
            
            if (!id(arduino_connected)) {
              id(arduino_connected) = true;
            }
            
            // ========== ОБРАБОТКА ВРЕМЕНИ ==========
            if (line.rfind("TIME:", 0) == 0) {
              std::string time_data = line.substr(5);
              id(current_time) = time_data;
              
              // Парсим время для отображения (только HH:MM)
              std::string time_short = time_data;
              size_t space_pos = time_short.find(' ');
              if (space_pos != std::string::npos) {
                time_short = time_short.substr(space_pos + 1);
                if (time_short.length() >= 5) {
                  time_short = time_short.substr(0, 5);
                }
              }
              
              // Обновляем виджеты времени
              auto time_label = lvgl.label.get_widget("time_label");
              if (time_label) {
                lvgl.label.update(time_label, "text", time_short);
              }
              auto time_label_modes = lvgl.label.get_widget("time_label_modes");
              if (time_label_modes) {
                lvgl.label.update(time_label_modes, "text", time_short);
              }
              auto time_label_settings = lvgl.label.get_widget("time_label_settings");
              if (time_label_settings) {
                lvgl.label.update(time_label_settings, "text", time_short);
              }
              
              // Обновляем screensaver время
              auto ss_time = lvgl.label.get_widget("screensaver_time");
              if (ss_time) {
                lvgl.label.update(ss_time, "text", time_short);
              }
              
              // Парсим дату для screensaver
              // TIME:2026-08-28 14:32:00 -> 28-авг-2026
              if (time_data.length() >= 10) {
                std::string date_part = time_data.substr(0, 10); // 2026-08-28
                int year = 0, month = 0, day = 0;
                try {
                  year = std::stoi(date_part.substr(0, 4));
                  month = std::stoi(date_part.substr(5, 2));
                  day = std::stoi(date_part.substr(8, 2));
                } catch (...) {
                  // ignore parse errors
                }
                
                const char* months[] = {"янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"};
                char date_str[32];
                if (year > 2000 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                  snprintf(date_str, sizeof(date_str), "%d-%s-%d", day, months[month-1], year);
                } else {
                  snprintf(date_str, sizeof(date_str), "-- --- ----");
                }
                id(current_date) = date_str;
                
                auto date_label = lvgl.label.get_widget("Date");
                if (date_label) {
                  lvgl.label.update(date_label, "text", date_str);
                }
                auto date_modes = lvgl.label.get_widget("Date_modes");
                if (date_modes) {
                  lvgl.label.update(date_modes, "text", date_str);
                }
                auto date_settings = lvgl.label.get_widget("Date_settings");
                if (date_settings) {
                  lvgl.label.update(date_settings, "text", date_str);
                }
                auto ss_date = lvgl.label.get_widget("screensaver_date");
                if (ss_date) {
                  lvgl.label.update(ss_date, "text", date_str);
                }
              }
            }
            // ========== ОБРАБОТКА ТЕМПЕРАТУР ==========
            else if (line.rfind("TEMP:", 0) == 0) {
              // TEMP:12.5,15.3,18.7,21.0
              std::string temp_data = line.substr(5);
              // Парсим через запятую
              size_t pos1 = temp_data.find(',');
              if (pos1 != std::string::npos) {
                try {
                  float t1 = std::stof(temp_data.substr(0, pos1));
                  size_t pos2 = temp_data.find(',', pos1+1);
                  if (pos2 != std::string::npos) {
                    float t2 = std::stof(temp_data.substr(pos1+1, pos2-pos1-1));
                    size_t pos3 = temp_data.find(',', pos2+1);
                    if (pos3 != std::string::npos) {
                      float t3 = std::stof(temp_data.substr(pos2+1, pos3-pos2-1));
                      float t4 = std::stof(temp_data.substr(pos3+1));
                      
                      id(temp_street) = t1;    // с улицы
                      id(temp_outdoor) = t2;   // на улицу
                      id(temp_from_home) = t3; // из дома
                      id(temp_to_home) = t4;   // в дом
                      
                      // Обновляем виджеты
                      char buf[16];
                      
                      auto label = lvgl.label.get_widget("gradussulicy");
                      if (label) {
                        snprintf(buf, sizeof(buf), "%+.1f", t1);
                        lvgl.label.update(label, "text", buf);
                      }
                      label = lvgl.label.get_widget("widget_1781262306198_b9dnjbboi");
                      if (label) {
                        snprintf(buf, sizeof(buf), "%+.1f", t2);
                        lvgl.label.update(label, "text", buf);
                      }
                      label = lvgl.label.get_widget("widget_1781262307812_3m3qdg397");
                      if (label) {
                        snprintf(buf, sizeof(buf), "%+.1f", t3);
                        lvgl.label.update(label, "text", buf);
                      }
                      label = lvgl.label.get_widget("widget_1781262308709_dnoiw7el6");
                      if (label) {
                        snprintf(buf, sizeof(buf), "%+.1f", t4);
                        lvgl.label.update(label, "text", buf);
                      }
                    }
                  }
                } catch (...) {
                  // ignore parse errors
                }
              }
            }
            // ========== ОБРАБОТКА ФИЛЬТРОВ ==========
            else if (line.rfind("FILTER:", 0) == 0) {
              std::string filter_data = line.substr(7);
              size_t pos = filter_data.find(',');
              if (pos != std::string::npos) {
                try {
                  int supply = std::stoi(filter_data.substr(0, pos));
                  int exhaust = std::stoi(filter_data.substr(pos+1));
                  
                  id(filter_supply) = supply;
                  id(filter_exhaust) = exhaust;
                  
                  // Обновляем виджеты фильтров
                  char buf[16];
                  
                  auto arc_supply = lvgl.arc.get_widget("widget_1781261697547_smtgd7w9q");
                  if (arc_supply) {
                    lvgl.arc.update(arc_supply, "value", supply);
                  }
                  auto label_supply = lvgl.label.get_widget("lv_label_0");
                  if (label_supply) {
                    snprintf(buf, sizeof(buf), "%d%%", supply);
                    lvgl.label.update(label_supply, "text", buf);
                  }
                  
                  auto arc_exhaust = lvgl.arc.get_widget("widget_1781261697547_jcbrfzs59");
                  if (arc_exhaust) {
                    lvgl.arc.update(arc_exhaust, "value", exhaust);
                  }
                  auto label_exhaust = lvgl.label.get_widget("widget_1781261697547_036jpjyoc");
                  if (label_exhaust) {
                    snprintf(buf, sizeof(buf), "%d%%", exhaust);
                    lvgl.label.update(label_exhaust, "text", buf);
                  }
                } catch (...) {
                  // ignore parse errors
                }
              }
            }
            // ========== ОБРАБОТКА РЕЖИМА ==========
            else if (line.rfind("MODE:", 0) == 0) {
              std::string mode_data = line.substr(5);
              mode_data.erase(0, mode_data.find_first_not_of(" \t\n\r"));
              mode_data.erase(mode_data.find_last_not_of(" \t\n\r") + 1);
              
              if (mode_data.length() > 0) {
                id(selected_mode) = mode_data;
                id(current_mode_from_arduino) = mode_data;
                
                // Обновляем главный экран
                auto mode_display = lvgl.label.get_widget("mode_display");
                if (mode_display) {
                  lvgl.label.update(mode_display, "text", mode_data);
                }
              }
            }
            // ========== ОБРАБОТКА СТАТУСА ==========
            else if (line.rfind("STATUS:", 0) == 0) {
              // STATUS:Mode=1,State=0,Temp=22.5,Error=OK,Heat=OFF,Cool=OFF,Speed=70,70,PID=0.0,Eff=85.0
              std::string status = line.substr(7);
              
              // Парсим температуру в доме
              size_t temp_pos = status.find("Temp=");
              if (temp_pos != std::string::npos) {
                size_t comma_pos = status.find(',', temp_pos);
                if (comma_pos != std::string::npos) {
                  try {
                    std::string temp_str = status.substr(temp_pos+5, comma_pos-temp_pos-5);
                    id(room_temp) = std::stof(temp_str);
                  } catch (...) {
                    // ignore parse errors
                  }
                }
              }
              
              // Парсим КПД
              size_t eff_pos = status.find("Eff=");
              if (eff_pos != std::string::npos) {
                try {
                  id(efficiency) = std::stof(status.substr(eff_pos+4));
                } catch (...) {
                  // ignore parse errors
                }
              }
              
              // Парсим состояние ошибки
              size_t err_pos = status.find("Error=");
              if (err_pos != std::string::npos) {
                size_t comma_pos = status.find(',', err_pos);
                if (comma_pos != std::string::npos) {
                  std::string err_str = status.substr(err_pos+6, comma_pos-err_pos-6);
                  if (err_str == "OK") {
                    id(has_error) = false;
                    id(current_error) = "";
                  } else {
                    id(has_error) = true;
                    id(current_error) = err_str;
                  }
                }
              }
              
              // Парсим состояние системы
              size_t state_pos = status.find("State=");
              if (state_pos != std::string::npos) {
                size_t comma_pos = status.find(',', state_pos);
                if (comma_pos != std::string::npos) {
                  try {
                    id(system_state) = std::stoi(status.substr(state_pos+6, comma_pos-state_pos-6));
                  } catch (...) {
                    // ignore parse errors
                  }
                }
              }
            }
            else if (line.rfind("PONG", 0) == 0) {
              id(arduino_connected) = true;
            }
            else if (line.rfind("OK:", 0) == 0) {
              // OK:MODE_ACCEPTED - режим принят
              // Просто логируем
            }
            
            newline_pos = id(uart_buffer).find('\n');
          }

  - interval: 50ms
    then:
      - lambda: |-
          if (id(screensaver_active)) {
            float target = id(screensaver_brightness);
            float step = 0.01;
            
            if (id(current_brightness) > target) {
              id(current_brightness) -= step;
              if (id(current_brightness) < target) {
                id(current_brightness) = target;
              }
              auto call = id(display_backlight).make_call();
              call.set_brightness(id(current_brightness));
              call.perform();
            }
          } else {
            float target = id(normal_brightness);
            float step = 0.03;
            
            if (id(current_brightness) < target) {
              id(current_brightness) += step;
              if (id(current_brightness) > target) {
                id(current_brightness) = target;
              }
              auto call = id(display_backlight).make_call();
              call.set_brightness(id(current_brightness));
              call.perform();
            }
          }

