esphome:
  name: esp32-display
  friendly_name: "4848s040"

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

# Глобальные переменные
globals:
  - id: uart_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: selected_mode
    type: std::string
    restore_value: no
    initial_value: '"СТАНДАРТНЫЙ"'
  - id: press_timer
    type: int
    restore_value: no
    initial_value: '0'
  - id: active_mode_id
    type: int
    restore_value: no
    initial_value: '0'
  - id: mode_activated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: inactivity_timer
    type: int
    restore_value: no
    initial_value: '0'
  - id: screensaver_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wakeup_block
    type: int
    restore_value: no
    initial_value: '0'
  - id: normal_brightness
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: screensaver_brightness
    type: float
    restore_value: no
    initial_value: '0.25'
  - id: current_brightness
    type: float
    restore_value: no
    initial_value: '1.0'
  # Watchdog связи с Arduino
  - id: last_uart_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: uart_link_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: data_stale
    type: bool
    restore_value: no
    initial_value: 'false'

# UART для связи с Arduino
uart:
  id: uart_arduino
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE

# Интервалы
interval:
  # ============================================================
  # 1) ЗАПРОС ДАННЫХ у Arduino каждые 2 секунды
  # ============================================================
  - interval: 2s
    then:
      - lambda: |-
          id(uart_arduino).write_str("GET_DATA\n");
          ESP_LOGD("uart", "Sent GET_DATA");

  # ============================================================
  # 2) ПАРСЕР UART — быстрый, ловит ответ Arduino
  # ============================================================
  - interval: 200ms
    then:
      - lambda: |-
          // ---- Чтение всего, что пришло ----
          int guard = 0;
          while (id(uart_arduino).available() && guard++ < 1024) {
            uint8_t byte;
            if (id(uart_arduino).read_byte(&byte)) {
              id(uart_buffer) += static_cast<char>(byte);
            }
          }

          // Ограничитель буфера на случай мусора
          if (id(uart_buffer).size() > 512) {
            id(uart_buffer).erase(0, id(uart_buffer).size() - 256);
          }

          bool got_valid = false;

          // Обрабатываем ВСЕ полные строки в буфере
          size_t newline_pos;
          while ((newline_pos = id(uart_buffer).find('\n')) != std::string::npos) {
            std::string line = id(uart_buffer).substr(0, newline_pos);
            id(uart_buffer) = id(uart_buffer).substr(newline_pos + 1);

            // \r убрать, пробелы по краям убрать
            line.erase(std::remove(line.begin(), line.end(), '\r'), line.end());
            size_t start = line.find_first_not_of(" \t");
            size_t end   = line.find_last_not_of(" \t");
            if (start == std::string::npos) continue;
            line = line.substr(start, end - start + 1);
            if (line.empty()) continue;

            ESP_LOGI("uart", "Line: %s", line.c_str());
            got_valid = true;

            // ==================== END ====================
            if (line == "END") {
              continue;   // маркер конца пакета — игнорируем
            }

            // ==================== TEMP ====================
            // TEMP:<OUT|IN|SUPPLY|EXHAUST>:<value>
            if (line.rfind("TEMP:", 0) == 0) {
              size_t c1 = line.find(':', 5);
              if (c1 != std::string::npos) {
                std::string sensor = line.substr(5, c1 - 5);
                float val = atof(line.substr(c1 + 1).c_str());
                char buf[16];
                snprintf(buf, sizeof(buf), "%.1f", val);

                if (sensor == "OUT") {
                  lv_label_set_text(id(temp_outdoor_val), buf);
                } else if (sensor == "IN") {
                  lv_label_set_text(id(temp_indoor_val), buf);
                } else if (sensor == "SUPPLY") {
                  lv_label_set_text(id(temp_supply_val), buf);
                } else if (sensor == "EXHAUST") {
                  lv_label_set_text(id(temp_exhaust_val), buf);
                }
              }
              continue;
            }

            // ==================== FILTER ====================
            // FILTER:<SUPPLY|EXHAUST>:<0-100>
            // 0% = чистый, 100% = забит
            // 0-50 зелёный, 51-70 жёлтый, 71-100 красный
            if (line.rfind("FILTER:", 0) == 0) {
              size_t c1 = line.find(':', 7);
              if (c1 != std::string::npos) {
                std::string ch = line.substr(7, c1 - 7);
                int pct = atoi(line.substr(c1 + 1).c_str());
                if (pct < 0)   pct = 0;
                if (pct > 100) pct = 100;

                lv_color_t color;
                if (pct <= 50) {
                  color = lv_color_hex(0x12D90D);
                } else if (pct <= 70) {
                  color = lv_color_hex(0xF59E0B);
                } else {
                  color = lv_color_hex(0xDC2626);
                }

                char buf[8];
                snprintf(buf, sizeof(buf), "%d%%", pct);

                if (ch == "SUPPLY") {
                  lv_arc_set_value(id(arc_filter_supply), pct);
                  lv_obj_set_style_arc_color(id(arc_filter_supply), color, LV_PART_INDICATOR);
                  lv_label_set_text(id(label_filter_supply_pct), buf);
                  lv_obj_set_style_text_color(id(label_filter_supply_pct), color, 0);
                } else if (ch == "EXHAUST") {
                  lv_arc_set_value(id(arc_filter_exhaust), pct);
                  lv_obj_set_style_arc_color(id(arc_filter_exhaust), color, LV_PART_INDICATOR);
                  lv_label_set_text(id(label_filter_exhaust_pct), buf);
                  lv_obj_set_style_text_color(id(label_filter_exhaust_pct), color, 0);
                }
              }
              continue;
            }

            // ==================== MODE ====================
            // MODE:<название>  — обновляем selected_mode и label (без переключения страниц!)
            if (line.rfind("MODE:", 0) == 0) {
              std::string mode = line.substr(5);
              size_t s = mode.find_first_not_of(" \t");
              size_t e = mode.find_last_not_of(" \t");
              if (s != std::string::npos) mode = mode.substr(s, e - s + 1);

              id(selected_mode) = mode;
              lv_label_set_text(id(mode_display), mode.c_str());

              if (mode == "СТОП") {
                lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0xFF0000), 0);
              } else {
                lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
              }
              continue;
            }

            // ==================== DATE / TIME ====================
            // DATE <дата> <время>  (или просто "<дата> <время>")
            std::string payload = line;
            if (payload.rfind("DATE ", 0) == 0) {
              payload = payload.substr(5);
            }

            size_t space_pos = payload.find(' ');
            if (space_pos != std::string::npos) {
              std::string date_part = payload.substr(0, space_pos);
              std::string time_part = payload.substr(space_pos + 1);

              lv_label_set_text(id(Date),                 date_part.c_str());
              lv_label_set_text(id(time_label),           time_part.c_str());
              lv_label_set_text(id(Date_modes),           date_part.c_str());
              lv_label_set_text(id(time_label_modes),     time_part.c_str());
              lv_label_set_text(id(Date_settings),        date_part.c_str());
              lv_label_set_text(id(time_label_settings),  time_part.c_str());
              lv_label_set_text(id(screensaver_date),     date_part.c_str());
              lv_label_set_text(id(screensaver_time),     time_part.c_str());
            }
          }

          if (got_valid) {
            id(last_uart_rx_ms) = millis();
            id(uart_link_ok) = true;
            if (id(data_stale)) {
              ESP_LOGI("uart", "Link restored");
              id(data_stale) = false;
            }
          }

  # ============================================================
  # 3) WATCHDOG: нет валидных строк > 60 с — показать NA
  # ============================================================
  - interval: 5s
    then:
      - lambda: |-
          if (!id(uart_link_ok)) return;
          uint32_t now = millis();
          if (id(last_uart_rx_ms) == 0) return;
          uint32_t age = now - id(last_uart_rx_ms);
          if (age > 60000 && !id(data_stale)) {
            ESP_LOGW("uart", "No data from Arduino for %u ms -> showing NA", age);
            id(data_stale) = true;
            // Температуры
            lv_label_set_text(id(temp_outdoor_val), "NA");
            lv_label_set_text(id(temp_indoor_val),  "NA");
            lv_label_set_text(id(temp_supply_val),  "NA");
            lv_label_set_text(id(temp_exhaust_val), "NA");
            // Фильтры -> NA и серый цвет
            lv_label_set_text(id(label_filter_supply_pct),  "NA");
            lv_label_set_text(id(label_filter_exhaust_pct), "NA");
            lv_obj_set_style_text_color(id(label_filter_supply_pct),  lv_color_hex(0x9CA3AF), 0);
            lv_obj_set_style_text_color(id(label_filter_exhaust_pct), lv_color_hex(0x9CA3AF), 0);
            lv_arc_set_value(id(arc_filter_supply), 0);
            lv_arc_set_value(id(arc_filter_exhaust), 0);
            lv_obj_set_style_arc_color(id(arc_filter_supply),  lv_color_hex(0x6B7280), LV_PART_INDICATOR);
            lv_obj_set_style_arc_color(id(arc_filter_exhaust), lv_color_hex(0x6B7280), LV_PART_INDICATOR);
            // Дата/время
            lv_label_set_text(id(Date),                "NA");
            lv_label_set_text(id(time_label),          "NA");
            lv_label_set_text(id(Date_modes),          "NA");
            lv_label_set_text(id(time_label_modes),    "NA");
            lv_label_set_text(id(Date_settings),       "NA");
            lv_label_set_text(id(time_label_settings), "NA");
            lv_label_set_text(id(screensaver_date),    "NA");
            lv_label_set_text(id(screensaver_time),    "NA");
          }

  # ============================================================
  # 4) Скринсейвер: тик 1 с
  # ============================================================
  - interval: 1s
    then:
      - lambda: |-
          if (id(wakeup_block) > 0) {
            id(wakeup_block)--;
            ESP_LOGD("screensaver", "Wakeup block: %d", id(wakeup_block));
          }

          if (!id(screensaver_active) && id(wakeup_block) == 0) {
            id(inactivity_timer)++;
            ESP_LOGD("screensaver", "Inactivity: %d seconds", id(inactivity_timer));

            if (id(inactivity_timer) >= 30) {
              ESP_LOGI("screensaver", "Activating screensaver!");
              id(screensaver_active) = true;
              id(inactivity_timer) = 0;
              lv_obj_t *scr = lv_obj_get_parent(id(screensaver_image));
              if (scr != nullptr) {
                lv_scr_load(scr);
                lv_refr_now(nullptr);
              }
            }
          }

  # ============================================================
  # 5) Кнопки режимов: удержание 3 с
  # ============================================================
  - interval: 100ms
    then:
      - lambda: |-
          if (id(press_timer) > 0) {
            id(press_timer) += 100;

            if (id(press_timer) >= 3000 && !id(mode_activated)) {
              id(press_timer) = 0;
              id(mode_activated) = true;

              ESP_LOGI("mode", "=== ACTIVATING MODE ===");

              lv_obj_t *main_page = lv_obj_get_parent(id(mode_display));
              if (main_page == nullptr) {
                main_page = lv_scr_act();
              }

              switch(id(active_mode_id)) {
                case 1:
                  id(selected_mode) = "СТАНДАРТНЫЙ";
                  lv_label_set_text(id(mode_display), "СТАНДАРТНЫЙ");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:STANDARD\n");
                  break;
                case 2:
                  id(selected_mode) = "ЭКОНОМИЧНЫЙ";
                  lv_label_set_text(id(mode_display), "ЭКОНОМИЧНЫЙ");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:ECONOM\n");
                  break;
                case 3:
                  id(selected_mode) = "ГОСТЕВОЙ";
                  lv_label_set_text(id(mode_display), "ГОСТЕВОЙ");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:GUEST\n");
                  break;
                case 4:
                  id(selected_mode) = "КОНДИЦИОНЕР";
                  lv_label_set_text(id(mode_display), "КОНДИЦИОНЕР");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:CONDITIONER\n");
                  break;
                case 5:
                  id(selected_mode) = "ВЫСОКИЙ КПД";
                  lv_label_set_text(id(mode_display), "ВЫСОКИЙ КПД");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0x0F0F33), 0);
                  id(uart_arduino).write_str("MODE:HIGH_EFFICIENCY\n");
                  break;
                case 6:
                  id(selected_mode) = "СТОП";
                  lv_label_set_text(id(mode_display), "СТОП");
                  lv_obj_set_style_text_color(id(mode_display), lv_color_hex(0xFF0000), 0);
                  id(uart_arduino).write_str("MODE:STOP\n");
                  break;
              }
              ESP_LOGI("mode", "Activated: %s", id(selected_mode).c_str());

              if (main_page != nullptr) {
                lv_scr_load(main_page);
                lv_refr_now(nullptr);
                ESP_LOGI("mode", "Switched to main page");
              } else {
                ESP_LOGE("mode", "main_page is null!");
              }

              id(active_mode_id) = 0;
              id(mode_activated) = false;
            }
          }

  # ============================================================
  # 6) Плавное затухание/пробуждение подсветки
  # ============================================================
  - interval: 50ms
    then:
      - lambda: |-
          if (id(screensaver_active)) {
            float target = id(screensaver_brightness);
            float step = 0.01;

            if (id(current_brightness) > target) {
              id(current_brightness) -= step;
              if (id(current_brightness) < target) {
                id(current_brightness) = target;
              }
              auto call = id(display_backlight).make_call();
              call.set_brightness(id(current_brightness));
              call.perform();
              ESP_LOGD("brightness", "Fading: %.2f", id(current_brightness));
            }
          } else {
            float target = id(normal_brightness);
            float step = 0.03;

            if (id(current_brightness) < target) {
              id(current_brightness) += step;
              if (id(current_brightness) > target) {
                id(current_brightness) = target;
              }
              auto call = id(display_backlight).make_call();
              call.set_brightness(id(current_brightness));
              call.perform();
              ESP_LOGD("brightness", "Waking: %.2f", id(current_brightness));
            }
          }

# ИЗОБРАЖЕНИЯ
image:
  - file: "img/olako.png"
    id: background_image
    type: RGB565
    resize: 480x480

  - file: "img/family-home.png"
    id: icon_home
    type: RGB565
    resize: 32x32
    transparency: alpha_channel

  - file: "img/mode-fan.png"
    id: icon_modes
    type: RGB565
    resize: 32x32
    transparency: alpha_channel

  - file: "img/settings-heart.png"
    id: icon_settings
    type: RGB565
    resize: 32x32
    transparency: alpha_channel

font:
  - file: "fonts/Roboto-Regular.ttf"
    id: cyrillic_font_40
    size: 40
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~АаБбВвГгДдЕеЁёЖжЗзИиЙйКкЛлМмНнОоПпРрСсТтУуФфХхЦцЧчШшЩщЪъЫыЬьЭэЮюЯя°'

  - file: "fonts/Roboto-Regular.ttf"
    id: cyrillic_font_24
    size: 24
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~АаБбВвГгДдЕеЁёЖжЗзИиЙйКкЛлМмНнОоПпРрСсТтУуФфХхЦцЧчШшЩщЪъЫыЬьЭэЮюЯя°'

  - file: "fonts/Roboto-Regular.ttf"
    id: cyrillic_font_12
    size: 12
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~АаБбВвГгДдЕеЁёЖжЗзИиЙйКкЛлМмНнОоПпРрСсТтУуФфХхЦцЧчШшЩщЪъЫыЬьЭэЮюЯя°'

# Реле
switch:
  - platform: gpio
    name: "Реле 1"
    pin:
      number: GPIO40
      inverted: true
  - platform: gpio
    name: "Реле 2"
    pin:
      number: GPIO2
      inverted: true
  - platform: gpio
    name: "Реле 3"
    pin:
      number: GPIO1
      inverted: true

# Подсветка
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Подсветка"
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# SPI для дисплея
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

# I2C для тачскрина (GT911)
i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl: GPIO45

# ДИСПЛЕЙ
display:
  - platform: mipi_rgb
    id: tft_display
    model: GUITION-4848S040
    spi_id: lcd_spi
    cs_pin: GPIO39
    invert_colors: False

# СЕНСОР ЭКРАНА (GT911)
touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: tft_display
    i2c_id: touchscreen_bus
    address: 0x5D
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            ESP_LOGI("touch", "Touched at x=%d, y=%d", touch.x, touch.y);
        - if:
            condition:
              lambda: 'return id(screensaver_active);'
            then:
              - lambda: |-
                  ESP_LOGI("touch", "Waking up from screensaver");
                  id(screensaver_active) = false;
                  id(inactivity_timer) = 0;
                  id(wakeup_block) = 5;
                  lv_obj_t *main_page = lv_obj_get_parent(id(mode_display));
                  if (main_page != nullptr) {
                    lv_scr_load(main_page);
                    lv_refr_now(nullptr);
                  }
            else:
              - lambda: |-
                  ESP_LOGI("touch", "Resetting inactivity timer");
                  id(inactivity_timer) = 0;
    on_release:
      then:
        - lambda: |-
            ESP_LOGI("touch", "Released");

# LVGL С КРАСИВЫМ ОФОРМЛЕНИЕМ
lvgl:
  id: lvgl_component
  displays:
    - tft_display
  touchscreens:
    - my_touchscreen
  rotation: 180

  buffer_size: 100%

  pages:
    # ========== СТРАНИЦА ЗАСТАВКИ ==========
    - id: screensaver_page
      bg_color: 0x000000
      bg_opa: 100%
      pad_all: 0
      widgets:
        - obj:
            id: black_background
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x000000
            bg_opa: 100%
            border_width: 0
            clickable: false

        - image:
            id: screensaver_image
            x: 0
            y: 0
            width: 480
            height: 480
            src: background_image
            align: CENTER
            opa: 100%
            clickable: false

        - obj:
            id: screensaver_info_bg
            x: 40
            y: 180
            width: 400
            height: 120
            bg_color: 0x000000
            bg_opa: 50%
            radius: 16
            border_width: 0
            shadow_width: 0
            clickable: false

        - label:
            id: screensaver_date
            x: 40
            y: 185
            width: 400
            height: 40
            text: "NA"
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: CLIP
            text_font: cyrillic_font_24
            opa: 100%
            clickable: false

        - label:
            id: screensaver_time
            x: 40
            y: 230
            width: 400
            height: 60
            text: "NA"
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: CLIP
            text_font: cyrillic_font_40
            opa: 100%
            clickable: false

        - label:
            id: screensaver_hint
            x: 0
            y: 450
            width: 480
            height: 30
            text: "Нажмите для выхода"
            text_color: 0x333333
            text_align: CENTER
            text_font: cyrillic_font_12
            opa: 50%
            clickable: false

        - button:
            id: wakeup_button
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x000000
            bg_opa: 0%
            border_width: 0
            shadow_width: 0
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("wakeup", "Wakeup button clicked!");
                - if:
                    condition:
                      lambda: 'return id(screensaver_active);'
                    then:
                      - lambda: |-
                          ESP_LOGI("wakeup", "Waking up from screensaver via button");
                          id(screensaver_active) = false;
                          id(inactivity_timer) = 0;
                          id(wakeup_block) = 5;
                          lv_obj_t *main_page = lv_obj_get_parent(id(mode_display));
                          if (main_page != nullptr) {
