              then:
                - lambda: |-
                    id(press_timer) = 100;
                    id(active_mode_id) = 6;
                    id(mode_activated) = false;
            on_release:
              then:
                - lambda: |-
                    if (id(press_timer) < 3000) {
                      id(press_timer) = 0;
                      id(active_mode_id) = 0;
                    }
